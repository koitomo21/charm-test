<style>
    :root {
        /* アイコンに合わせたパステルイエロー＆ピンク系 */
        --primary-color: #f7a8b8;      /* メインの可愛いピンク */
        --primary-hover: #e08ea0;      /* ホバー時のピンク */
        --bg-color: #fffde8;           /* 背景のやわらかクリームイエロー */
        --card-bg: #ffffff;            /* カード背景 */
        --text-color: #5a4234;          /* アイコン文字に合わせたやわらかブラウン（視認性◎） */
        --accent-color: #ffd166;        /* アクセントのきらめきイエロー */
        --border-color: #ffe6a7;        /* 枠線のパステルカラー */
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        padding: 20px 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        max-width: 600px;
        width: 100%;
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(247, 168, 184, 0.2);
        padding: 30px 20px;
        position: relative;
        overflow: hidden;
        border: 3px solid #fff5c0;
    }

    h1 {
        font-size: 1.6rem;
        color: #d66880;
        text-align: center;
        margin-bottom: 10px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: #8c7365;
        margin-bottom: 25px;
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    .start-btn, .action-btn {
        display: block;
        width: 100%;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        background-color: #f7a8b8;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(247, 168, 184, 0.4);
        margin-top: 20px;
        text-decoration: none;
    }

    .start-btn:hover, .action-btn:hover {
        background-color: #e08ea0;
        transform: translateY(-2px);
    }

    .intro-text {
        font-size: 0.95rem;
        color: var(--text-color);
        margin-bottom: 20px;
        background: #fffbe6;
        border: 2px dashed #ffe58f;
        padding: 15px;
        border-radius: 12px;
    }

    .progress-bar-container {
        width: 100%;
        height: 10px;
        background: #fff2d6;
        border-radius: 5px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ffd166, #f7a8b8);
        transition: width 0.3s ease;
    }

    .question-counter {
        font-size: 0.85rem;
        color: #d66880;
        font-weight: bold;
        text-align: right;
        margin-bottom: 10px;
    }

    .question-text {
        font-size: 1.15rem;
        font-weight: 600;
        margin-bottom: 25px;
        min-height: 3rem;
        display: flex;
        align-items: center;
        color: var(--text-color);
    }

    .options-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .option-btn {
        background: #fff9ed;
        border: 2px solid #ffe8b3;
        padding: 14px 18px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-color);
        cursor: pointer;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
        outline: none;
        user-select: none;
        transition: all 0.15s ease;
    }

    /* タップされた瞬間のスタイル */
    .option-btn.selected {
        background-color: #f7a8b8 !important;
        border-color: #f7a8b8 !important;
        color: #ffffff !important;
        transform: scale(0.98);
    }

    .option-btn.selected span {
        color: #ffffff !important;
        opacity: 1 !important;
    }

    .prev-btn {
        background: none;
        border: none;
        color: #a38c7d;
        font-size: 0.9rem;
        cursor: pointer;
        margin-top: 20px;
        display: inline-block;
        text-decoration: underline;
    }

    .result-type-box {
        text-align: center;
        background: linear-gradient(135deg, #f7a8b8, #ffd166);
        color: #fff;
        padding: 20px;
        border-radius: 16px;
        margin-bottom: 25px;
        box-shadow: 0 4px 15px rgba(247, 168, 184, 0.4);
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .result-type-box .label {
        font-size: 0.9rem;
        opacity: 0.95;
    }

    .result-type-box .type-name {
        font-size: 2.2rem;
        font-weight: 800;
        margin: 5px 0;
        letter-spacing: 2px;
    }

    .chart-container {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto 25px auto;
    }

    .score-list {
        background: #fffdf5;
        border: 2px solid #ffe8b3;
        border-radius: 14px;
        padding: 15px;
        margin-bottom: 25px;
    }

    .score-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px dashed #ffd899;
        font-size: 0.95rem;
    }

    .score-item:last-child {
        border-bottom: none;
    }

    .score-item .type-title {
        font-weight: bold;
    }

    .score-item .percentage {
        font-weight: 700;
        color: #d66880;
    }

    .type-desc {
        background: #fff5f7;
        border-left: 4px solid #f7a8b8;
        padding: 15px;
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: 25px;
        border-radius: 0 12px 12px 0;
        color: var(--text-color);
    }

    .line-share-btn {
        background-color: #06C755;
        box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .line-share-btn:hover {
        background-color: #05b34c;
    }

    .retry-btn {
        background: #f0e6df;
        color: #665246;
        box-shadow: none;
        margin-top: 12px;
    }

    .retry-btn:hover {
        background: #e2d4c9;
    }

    @media (max-width: 480px) {
        .container {
            padding: 20px 15px;
        }
        .question-text {
            font-size: 1.05rem;
        }
        .option-btn {
            padding: 12px 14px;
            font-size: 0.95rem;
        }
    }
</style>
